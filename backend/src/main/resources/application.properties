# Owner: Erin
# What: Server settings. Every database value can be replaced by an environment variable.
#       With no variables set, the server uses a local H2 file database, so nobody needs PostgreSQL to develop.
#       Docker Compose sets SPRING_DATASOURCE_* to point at PostgreSQL instead.
# Checklist: the database keeps the rows after a restart, with ddl-auto=update.
# Depends on: nothing. Yyan's docker-compose.yml depends on the variable names below.
# Never use ddl-auto=create or create-drop. They delete the data on restart.

spring.application.name=coworkhub
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/coworkhub;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# H2 console at http://localhost:8080/h2-console for local development only. Docker turns it off.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Swagger UI at http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
